name: Y2Mate Domain Watchdog

on:
  push:
    branches: [ main ]
  schedule:
    # 4 clean continuous handover sessions daily (00:00, 06:00, 12:00, 18:00 UTC) with zero queue overflow
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allows manual trigger anytime

concurrency:
  group: domain-watchdog
  cancel-in-progress: false

jobs:
  check-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Allows continuous execution up to 6 hours
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Domain Availability Sniper
        env:
          GODADDY_TOKEN: ${{ secrets.GODADDY_TOKEN || 'gd_pat_mkTG9UGo5YyNUITj2bCJLPsswGYYYnzGdfDGBYyPGyb_08c1b0ac' }}
          AHREFS_KEY: ${{ secrets.AHREFS_KEY || 'yAlv3OBM7h_8pwthcGYdFYbUIQ-TBoQndItVZLo7' }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || 'abbasgawali111@gmail.com' }}
        run: node sniper.js
